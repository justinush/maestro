schemaVersion: "0.1"
id: embed-kyc-demo
version: "1.0.0"
title: Embed KYC demo
description: Human profile → stubbed liveness check → approved (for examples/embed-kyc-service).

initialStepId: collect-profile
terminalStepIds:
  - approved

steps:
  - id: collect-profile
    kind: human
    presentationRef: forms/collect-profile@v1
    inputSchema:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
    onEnter:
      - type: stub
        id: init-stage
        params:
          set:
            stage: "profile"

  - id: run-checks
    kind: action
    onEnter:
      - type: stub
        id: liveness-check
        params:
          set:
            livenessCompleted: true

  - id: approved
    kind: end

transitions:
  - from: collect-profile
    to: run-checks
    priority: 0

  - from: run-checks
    to: approved
    priority: 0
    when: "variables.livenessCompleted == true"
