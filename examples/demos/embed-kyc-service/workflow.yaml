schemaVersion: "0.1"
id: embed-kyc-demo
version: "1.0.0"
title: Embed KYC demo
description: Collect profile, run liveness check (stub), approve when liveness passes.

initialStepId: collect-profile
terminalStepIds:
  - approved

steps:
  - id: collect-profile
    kind: human
    presentationRef: forms/collect-profile@v1
    inputSchema:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
    onEnter:
      - type: stub
        id: init-stage
        params:
          set:
            stage: "profile"

  - id: run-liveness-check
    kind: action
    description: Stub stands in for vendor liveness (see http-runner for real HTTP).
    onEnter:
      - type: stub
        id: record-liveness-pass
        params:
          set:
            liveness:
              passed: true

  - id: approved
    kind: end

transitions:
  - from: collect-profile
    to: run-liveness-check
    priority: 0

  - from: run-liveness-check
    to: approved
    priority: 0
    when: "variables.liveness.passed == true"
