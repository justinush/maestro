version: "2"
run:
  timeout: 5m
linters:
  enable:
    - asciicheck
    - bidichk
    - dogsled
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - forcetypeassert
    - gocritic
    - godot
    - gomoddirectives
    - goprintffuncname
    - govet
    - ineffassign
    - makezero
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - whitespace
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
      custom-order: true
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    gofumpt:
      extra-rules: true
