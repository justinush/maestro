name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1

  ci:
    name: test / smoke / build / race / postgres
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro -d maestro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: CI (verify, fmt-check, vet, test, smoke, build)
        run: make ci-action

      - name: Postgres store integration tests
        env:
          MAESTRO_TEST_DATABASE_URL: postgres://maestro:maestro@localhost:5432/maestro_test?sslmode=disable
        run: go test -count=1 -timeout=10m ./pkg/run/postgres/...

      - name: Race tests
        run: make test-race
